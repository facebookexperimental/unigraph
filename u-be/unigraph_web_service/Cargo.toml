[package]
edition = "2024"
name = "unigraph_web_service"
publish = false
version = "0.0.0"

[dependencies]
anyhow = "1.0.98"
axum = "0.8.3"
hyper = "1"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
serde_json = "1"
tokio = { workspace = true }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unigraph_core = { path = "../unigraph_core" }
unigraph_serialization = { path = "../unigraph_serialization" }
