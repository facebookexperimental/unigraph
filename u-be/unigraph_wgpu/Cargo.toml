[package]
edition = "2024"
name = "unigraph_wgpu"
publish = false
version = "0.0.0"

[dependencies]
anyhow = "1.0.98"
bitflags = { version = "2.6", features = [
    "serde",
    "std",
], default-features = false }
bytemuck = "1.22.0"
glam = { version = "0.30.2", features = ["bytemuck", "serde"] }
log = "0.4"
serde = { version = "1.0.219" }
serde_json = "1.0.140"
unigraph_core = { path = "../unigraph_core" }
web-time = "1.1.0"
wgpu = "25.0.0"
winit = "0.30.9"
typegen = { path = "../typegen" }
unigraph_graph_state = { path = "../unigraph_graph_state" }

[dev-dependencies]
k9 = "*"
