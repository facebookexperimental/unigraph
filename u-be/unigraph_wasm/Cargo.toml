[package]
edition = "2024"
name = "unigraph_wasm"
publish = false
version = "0.0.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0.98"
base64 = "0.22.1"
console_error_panic_hook = "0.1.7"
console_log = "1"
getrandom = { version = "0.3", features = ["wasm_js"] }
log = "0.4"
serde_json = "1.0.140"
unigraph_core = { path = "../unigraph_core" }
unigraph_wgpu = { path = "../unigraph_wgpu" }
wasm-bindgen = "*"
wasm-bindgen-futures = "0.4.45"
winit = "0.30.9"
zstd = "0.13.3" # NOTE: zstdmt feature is not supported in wasm (no thread support)

[dependencies.web-sys]
features = [
    'Document',
    'Element',
    'HtmlCanvasElement',
    'WebGlBuffer',
    'WebGlVertexArrayObject',
    'WebGl2RenderingContext',
    'WebGlProgram',
    'WebGlShader',
    'Window',
]
version = "*"

[dev-dependencies]
k9 = "*"
