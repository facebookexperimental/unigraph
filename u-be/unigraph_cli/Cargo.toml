# @generated by autocargo from //unigraph/oss:[unigraph_cli,unigraph_cli_lib]

[package]
name = "unigraph"
version = "0.1.1-alpha.0"
authors = ["Meta Platforms, Inc. and affiliates"]
edition = "2024"
description = "Interactive graph visualization and exploration tool"
homepage = "https://github.com/facebookexperimental/unigraph"
repository = "https://github.com/facebookexperimental/unigraph"
license = "MIT"

[lib]
name = "unigraph_cli"

[[bin]]
name = "unigraph_cli"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.2", features = ["derive", "env", "string", "unicode", "wrap_help"] }
crossterm = { version = "0.29", features = ["event-stream", "serde"] }
dirs = "6.0"
ll = "10.0.0"
ll_stdio = "10.0.0"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.151", features = ["alloc", "float_roundtrip", "raw_value", "unbounded_depth"] }
tokio = { version = "1.52.4", features = ["full", "test-util", "tracing"] }
tracing-subscriber = { version = "0.3.23", features = ["chrono", "env-filter", "json", "local-time", "parking_lot", "registry"] }
unigraph_app = { version = "0.1.1-alpha.0", path = "../unigraph_app" }
unigraph_core = { version = "0.1.1-alpha.0", path = "../unigraph_core" }
unigraph_db = { version = "0.1.1-alpha.0", path = "../unigraph_db" }
unigraph_ingestion = { version = "0.1.1-alpha.0", path = "../unigraph_ingestion" }
unigraph_storage_core = { version = "0.1.1-alpha.0", path = "../unigraph_storage_core" }
unigraph_storage_sqlite = { version = "0.1.1-alpha.0", path = "../unigraph_storage_sqlite" }
unigraph_timestamp = { version = "0.1.1-alpha.0", path = "../unigraph_timestamp" }
unigraph_web_service = { version = "0.1.1-alpha.0", path = "../unigraph_web_service" }
